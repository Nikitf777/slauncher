[package]
name = "slauncher-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
env_logger = "0.11.11"
log = "0.4"
sea-orm = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "fs"] }
